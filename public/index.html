<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Love Push</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#ff4f8b" />
</head>
<body>
  <h1>Love Push ❤️</h1>
  <button id="subscribe">Разрешить уведомления</button>

  <script>
    const VAPID_PUBLIC_KEY = "ВСТАВЬ_СЮДА_PUBLIC_KEY";

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding)
        .replace(/-/g, "+")
        .replace(/_/g, "/");

      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
    }

    document.getElementById("subscribe").onclick = async () => {
      const registration = await navigator.serviceWorker.register("/sw.js");

      const permission = await Notification.requestPermission();

      if (permission !== "granted") {
        alert("Уведомления не разрешены");
        return;
      }

      const subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });

      await fetch("/api/subscribe", {
        method: "POST",
        headers: {
          "content-type": "application/json"
        },
        body: JSON.stringify(subscription)
      });

      alert("Готово! Теперь уведомления будут приходить сюда ❤️");
    };
  </script>
</body>
</html>
